[package]
name = "learning-assistant"
version = "0.1.0"
description = "Learning Assistant — floating macOS panel + Next.js sidecar"
authors = ["Nick"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "learning_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
chrono = "0.4"
url = "2"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
objc = "0.2.7"
core-graphics = "0.24"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
